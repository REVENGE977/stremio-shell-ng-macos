[package]
name = "stremio-enhanced-ng"
version = "5.0.27-enhanced.5"
edition = "2021"
authors = ["REVENGE977", "Smart Code OOD"]

[dependencies]
base64 = "0.22"
discord-rich-presence = "1"
once_cell = "1.19"
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "unicode"] }
open = "5"
urlencoding = "2"
parse-display = "0.9"
flume = "0.11"
whoami = "1.5"
anyhow = "1"
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
rand = "0.8"
url = { version = "2", features = ["serde"] }
uuid = { version = "1.19", features = ["v4"] }
dirs = "6"
tao = "0.30"
wry = { version = "0.47", features = ["transparent", "fullscreen", "devtools"] }
objc = "0.2"
libc = "0.2"

[dev-dependencies]
serde_test = "1.0.*"
