name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish artifacts to a GitHub Release'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Release tag (optional; defaults to v<Cargo.toml version>)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple Silicon (arm64)
          - runner: macos-15-intel
            arch: x86_64
            label: Intel (x86_64)

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Homebrew dependencies
        run: |
          brew install mpv ffmpeg pkg-config node

      - name: Build and bundle macOS app
        run: |
          bash ./build-macos.sh

      - name: Package .zip and .dmg artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP_PATH="target/release/Stremio Enhanced.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            exit 1
          fi

          VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          mkdir -p dist

          ZIP_NAME="Stremio-Enhanced-v${VERSION}-macOS-${ARCH}.zip"
          DMG_NAME="Stremio-Enhanced-v${VERSION}-macOS-${ARCH}.dmg"

          # Preserve symlinks, permissions, and code signatures cleanly
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/${ZIP_NAME}"

          # Build drag-to-Applications DMG
          DMG_STAGE="$(mktemp -d)"
          cp -R "$APP_PATH" "${DMG_STAGE}/Stremio Enhanced.app"
          ln -s /Applications "${DMG_STAGE}/Applications"
          hdiutil create \
            -volname "Stremio Enhanced" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"
          rm -rf "$DMG_STAGE"

          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stremio-enhanced-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify GH_PAT and publish release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Error: GH_PAT secret (or GITHUB_TOKEN) is not configured."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
            TAG="v${VERSION}"
          fi

          echo "==> Publishing macOS build assets to release ${TAG}..."
          ls -lh release-assets/

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --title "Stremio Enhanced macOS ${TAG}" \
              --generate-notes
          fi
